name: Release

# Builds Notepad for macOS, Windows and Linux and attaches the packaged
# artifacts to a GitHub Release. Triggered by pushing a tag like `v1.0.0`,
# or run manually (workflow_dispatch) to just produce build artifacts.
#
# macOS ships a DMG, code-signed and notarized when the Developer ID secrets are
# configured (see the macos job for the list); ad-hoc signed otherwise.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  QT_VERSION_MACOS: '6.11.0'
  QT_VERSION_WINDOWS: '6.10.1'
  QT_VERSION_LINUX: '6.10.1'

jobs:
  # ----------------------------------------------------------------- macOS
  #
  # Produces a DMG. When the Developer ID secrets are present the app is signed
  # with a Developer ID Application certificate, hardened-runtime enabled, and
  # notarized + stapled, so Gatekeeper opens it without warnings. Without the
  # secrets the same DMG is built with an ad-hoc signature: fine for local use,
  # but macOS will warn on other machines.
  #
  # Required repository secrets (all optional; signing is skipped if unset):
  #   MACOS_CERT_P12         base64 of the Developer ID Application .p12
  #   MACOS_CERT_PASSWORD    password used when exporting that .p12
  #   MACOS_SIGN_IDENTITY    e.g. "Developer ID Application: Name (TEAMID)"
  #   MACOS_TEAM_ID          10-character Apple team id
  #   MACOS_NOTARY_APPLE_ID  Apple ID used for notarization
  #   MACOS_NOTARY_PASSWORD  app-specific password for that Apple ID
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_MACOS }}
          cache: true

      # The certificate lives in a throwaway keychain that is deleted at the end
      # of the job, so it never persists on the runner.
      - name: Import Developer ID certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "No Developer ID secrets set — falling back to ad-hoc signing."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNOTEPAD_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}"
          cmake --build build

      - name: Deploy Qt
        run: macdeployqt build/Notepad.app -verbose=1

      # macdeployqt copies plugins it finds, not only the ones we can reach.
      # The virtual-keyboard input plugin is the sole thing pulling in the whole
      # QML stack (QtQuick + QtQml*), and we ship a Widgets app, so both go.
      # The TLS and network-information plugins exist for QtNetwork, which we use
      # only for a local socket. Measured locally: 91 MB -> 79 MB.
      #
      # OpenSSL deliberately stays: QtNetwork hard-links libssl/libcrypto, and
      # removing them makes the app fail to start with a dyld error.
      - name: Prune unused Qt components
        run: |
          set -eu
          APP=build/Notepad.app
          before=$(du -sm "$APP" | cut -f1)
          rm -rf "$APP/Contents/PlugIns/platforminputcontexts"
          rm -rf "$APP/Contents/Frameworks/QtQuick.framework"
          rm -rf "$APP"/Contents/Frameworks/QtQml*.framework
          rm -rf "$APP/Contents/PlugIns/tls"
          rm -rf "$APP/Contents/PlugIns/networkinformation"
          # Shipped broken by macdeployqt anyway: it references QtPdf, which is
          # never copied, so the plugin can only fail to load.
          rm -f "$APP"/Contents/PlugIns/imageformats/libqpdf.dylib
          after=$(du -sm "$APP" | cut -f1)
          echo "bundle: ${before}MB -> ${after}MB"

          # Fail the build rather than ship a bundle with a broken link.
          missing=0
          while IFS= read -r bin; do
            while IFS= read -r dep; do
              case "$dep" in
                @executable_path/*) path="$APP/Contents/MacOS/${dep#@executable_path/}" ;;
                @rpath/*)           path="$APP/Contents/Frameworks/${dep#@rpath/}" ;;
                *) continue ;;
              esac
              if [ ! -e "$path" ]; then
                echo "::error::$bin still references missing $dep"
                missing=1
              fi
            done <<< "$(otool -L "$bin" | tail -n +2 | awk '{print $1}')"
          done <<< "$(find "$APP" -type f \( -name '*.dylib' -o -perm +111 \) | grep -v '\.appex/')"
          [ "$missing" -eq 0 ] || exit 1
          echo "all bundle-internal references resolve"

      # Everything must be signed inside-out, and the bundled Qt frameworks need
      # OUR identity too: with hardened runtime enabled, library validation
      # refuses to load nested code signed by a different team.
      - name: Sign bundle
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          APP=build/Notepad.app
          if [ "$SIGNED" = "true" ]; then
            OPTS=(--force --timestamp --options runtime --sign "$IDENTITY")
          else
            OPTS=(--force --sign -)
          fi

          # Sign every match of a pattern, tolerating a directory that does not
          # exist: piping a failing `find` would abort the step under pipefail.
          sign_tree() {
            local dir="$1" pattern="$2" type="$3"
            [ -d "$dir" ] || return 0
            while IFS= read -r -d '' f; do
              codesign "${OPTS[@]}" "$f"
            done < <(find "$dir" -name "$pattern" -type "$type" -print0)
          }

          # Nested code first, so each signature covers already-signed contents.
          sign_tree "$APP/Contents/Frameworks" "*.dylib" f
          sign_tree "$APP/Contents/Frameworks" "*.framework" d
          sign_tree "$APP/Contents/PlugIns" "*.dylib" f

          # Then the Quick Look app extensions, with their entitlements.
          for ext in Thumbnail Preview; do
            APPEX="$APP/Contents/PlugIns/Notepad$ext.appex"
            [ -d "$APPEX" ] || continue
            if [ "$SIGNED" = "true" ]; then
              codesign --force --timestamp --options runtime \
                --entitlements "mac/${ext}Extension/${ext}.entitlements" \
                --sign "$IDENTITY" "$APPEX"
            else
              codesign --force --sign - "$APPEX"
            fi
          done

          # The app last, so its signature covers the finished bundle.
          codesign "${OPTS[@]}" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build DMG
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R build/Notepad.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"     # drag-to-install target
          hdiutil create -volname "Notepad" -srcfolder "$STAGE" -ov \
            -format UDZO -fs HFS+ Notepad-macos.dmg
          hdiutil verify Notepad-macos.dmg

      - name: Sign, notarize & staple DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$IDENTITY" Notepad-macos.dmg
          if [ -z "$APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::Signed but NOT notarized — set MACOS_NOTARY_APPLE_ID," \
                 "MACOS_NOTARY_PASSWORD and MACOS_TEAM_ID to enable notarization."
            exit 0
          fi
          # --wait blocks until Apple returns a verdict (usually a few minutes).
          xcrun notarytool submit Notepad-macos.dmg \
            --apple-id "$APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$TEAM_ID" \
            --wait --timeout 30m
          # Stapling attaches the ticket so Gatekeeper passes it offline too.
          xcrun stapler staple Notepad-macos.dmg
          xcrun stapler validate Notepad-macos.dmg
          spctl --assess --type open --context context:primary-signature -vv Notepad-macos.dmg

      - name: Report signing status
        run: |
          echo "### macOS package" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "Signed with a Developer ID certificate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ad-hoc signed (no Developer ID secrets configured). macOS will" \
                 "warn users on first launch." >> "$GITHUB_STEP_SUMMARY"
          fi
          codesign -dv --verbose=2 build/Notepad.app 2>&1 | sed 's/^/    /' \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Notepad-macos
          path: Notepad-macos.dmg

  # ----------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & build
        # Ninja + MSVC env is more reliable than CMake's VS-generator detection.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Deploy Qt & package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Notepad.exe dist/
          Copy-Item build/NoteThumbnail.dll dist/
          windeployqt --release --dir dist dist/Notepad.exe
          Compress-Archive -Path dist/* -DestinationPath Notepad-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Notepad-windows
          path: Notepad-windows.zip

  # ----------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev \
                                  file fuse

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_LINUX }}
          cache: true

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Stage AppDir
        run: |
          # The install step lays down the real app icon at
          # AppDir/usr/share/icons/hicolor/256x256/apps/notepad.png
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/notepad.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/notepad.png \
            --executable AppDir/usr/bin/Notepad
          mv Notepad*.AppImage Notepad-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Notepad-linux
          path: Notepad-linux-x86_64.AppImage

  # ----------------------------------------------------------------- Release
  release:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Until the DMG is signed with a Developer ID and notarized, macOS
          # quarantines it on download and refuses to open it. Say so up front
          # rather than letting people hit "Notepad is damaged".
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS | `Notepad-macos.dmg` |
            | Windows | `Notepad-windows.zip` |
            | Linux | `Notepad-linux-x86_64.AppImage` |

            ### Opening it on macOS

            This build is ad-hoc signed but **not notarized**, so on first launch
            macOS will say the app "cannot be opened because Apple cannot check it
            for malicious software", or that it is damaged. That is quarantine,
            not a broken download. Either:

            - **Right-click** `Notepad.app` in Applications and choose **Open**,
              then confirm — you only need to do this once; or
            - run `xattr -dr com.apple.quarantine /Applications/Notepad.app`

            ### Opening it on Windows

            SmartScreen may warn about an unrecognised publisher: choose
            **More info → Run anyway**.

            ### Linux

            `chmod +x Notepad-linux-x86_64.AppImage` and run it.
